<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tamim Quiz</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#0b1020;
  color:#fff;
}

.app{
  max-width:700px;
  margin:auto;
  padding:20px;
}

.card{
  background:#151d35;
  border:1px solid #293452;
  border-radius:22px;
  padding:20px;
  box-shadow:0 12px 35px #0004;
}

h1,h2{margin-top:0}

.menu{
  display:grid;
  gap:12px;
}

.primary,.secondary,.danger,.player,.option{
  border:0;
  border-radius:16px;
  padding:15px;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#4f7cff;
  color:white;
}

.secondary{
  background:#27324f;
  color:white;
}

.danger{
  background:#9d3140;
  color:white;
}

.player,.option{
  background:#202a46;
  color:white;
  text-align:right;
  width:100%;
  margin-bottom:10px;
}

.player:hover,.option:hover,.secondary:hover{
  filter:brightness(1.15);
}

.topbar{
  display:flex;
  justify-content:space-between;
  gap:8px;
  flex-wrap:wrap;
}

.stat{
  background:#202a46;
  padding:9px 12px;
  border-radius:12px;
}

.progress{
  height:9px;
  background:#252e49;
  border-radius:10px;
  overflow:hidden;
  margin:15px 0;
}

.progress>div{
  height:100%;
  background:#4f7cff;
}

.timer{
  text-align:center;
  font-size:24px;
  font-weight:800;
}

.question{
  font-size:24px;
  line-height:1.6;
  font-weight:800;
  margin:25px 0;
}

.feedback{
  padding:13px;
  border-radius:14px;
  margin:12px 0;
}

.success{
  background:#173f2d;
}

.notice{
  background:#3c3217;
}

.result{
  text-align:center;
}

.leaderboard-row,
.achievement,
.settings-row{
  background:#202a46;
  border-radius:14px;
  padding:14px;
  margin:9px 0;
}

.settings-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.toggle{
  width:55px;
  height:30px;
  border-radius:30px;
  border:0;
  background:#555;
  position:relative;
}

.toggle.on{
  background:#4f7cff;
}

.toggle:after{
  content:"";
  position:absolute;
  width:24px;
  height:24px;
  top:3px;
  left:4px;
  background:white;
  border-radius:50%;
}

.toggle.on:after{
  left:27px;
}

.small{
  opacity:.75;
  font-size:13px;
}
</style>
</head>

<body>

<div class="app">
  <div id="app"></div>
</div>

let players=JSON.parse(
  localStorage.getItem("tamimPlayers") ||
  '["سيدرا","تميم","شيراز","تيم"]'
);

let stats=JSON.parse(
  localStorage.getItem("tamimStats") || "{}"
);

let settings=JSON.parse(
  localStorage.getItem("tamimSettings") ||
  '{"sound":true}'
);

let player=null;
let difficulty=null;
let category=null;
let round=[];
let index=0;
let score=0;
let correct=0;
let combo=0;
let bestCombo=0;
let timer=null;
let timeLeft=15;

function save(){

  localStorage.setItem(
    "tamimPlayers",
    JSON.stringify(players)
  );

  localStorage.setItem(
    "tamimStats",
    JSON.stringify(stats)
  );

  localStorage.setItem(
    "tamimSettings",
    JSON.stringify(settings)
  );

}

function app(html){

  document.getElementById("app").innerHTML=html;

}

function home(){

  app(`
  <div class="card">

    <h1>🚀 Tamim Quiz</h1>

    <p>لعبة أسئلة عائلية ممتعة 🎉</p>

    <div class="menu">

      <button class="primary"
      onclick="openPlayers()">
      🚀 ابدأ اللعب
      </button>

      <button class="secondary"
      onclick="openPlayers()">
      👨‍👩‍👧‍👦 اختيار اللاعب
      </button>

      <button class="secondary"
      onclick="openDifficulty()">
      🧠 اختيار الصعوبة
      </button>

      <button class="secondary"
      onclick="openCategories()">
      📚 الفئات
      </button>

      <button class="secondary"
      onclick="leaderboard()">
      🏆 لوحة الأبطال
      </button>

      <button class="secondary"
      onclick="achievements()">
      ⭐ إنجازاتي
      </button>

      <button class="secondary"
      onclick="settingsPage()">
      ⚙️ الإعدادات
      </button>

    </div>

  </div>
  `);

}

function openPlayers(){

  app(`
  <div class="card">

    <h2>👨‍👩‍👧‍👦 اختر اللاعب</h2>

    <div id="plist"></div>

    <button class="secondary"
    onclick="home()">
    ⬅️ الرئيسية
    </button>

  </div>
  `);

  renderPlayers();

}

function renderPlayers(){

  document.getElementById("plist").innerHTML=

    players.map((p,i)=>`

      <button
      class="player"
      onclick="selectPlayer(${i})">

      👤 ${p}

      </button>

    `).join("")

    +

    `

    <button
    class="player"
    onclick="addPlayer()">

    ➕ لاعب جديد

    </button>

    `;

}

function addPlayer(){

  let n=prompt("اكتب اسم اللاعب الجديد:");

  if(!n)return;

  n=n.trim();

  if(!n)return;

  if(!players.includes(n))
    players.push(n);

  save();

  player=n;

  openDifficulty();

}

function selectPlayer(i){

  player=players[i];

  openDifficulty();

}

function openDifficulty(){

  app(`
  <div class="card">

    <h2>🧠 اختر الصعوبة</h2>

    <div class="menu">

      ${Object.entries(diffs).map(
        ([k,v])=>
        `<button
        class="secondary"
        onclick="selectDifficulty('${k}')">
        ${v}
        </button>`
      ).join("")}

    </div>

    <button
    class="secondary"
    style="margin-top:12px"
    onclick="openPlayers()">

    ⬅️ رجوع

    </button>

  </div>
  `);

}

function selectDifficulty(d){

  difficulty=d;

  openCategories();

}

function openCategories(){

  app(`
  <div class="card">

    <h2>📚 اختر الفئة</h2>

    <div class="menu">

      ${Object.entries(cats).map(
        ([k,v])=>
        `<button
        class="secondary"
        onclick="startGame('${k}')">
        ${v}
        </button>`
      ).join("")}

    </div>

    <button
    class="secondary"
    style="margin-top:12px"
    onclick="openDifficulty()">

    ⬅️ رجوع

    </button>

  </div>
  `);

}

function startGame(cat){

  category=cat;

  let pool=questions.filter(x=>

    (category==="all" || x.cat===category)

    &&

    (difficulty==="random" || x.d===difficulty)

  );

  if(pool.length<10){

    pool=questions.filter(x=>
      category==="all" || x.cat===category
    );

  }

  round=pool
    .sort(()=>Math.random()-.5)
    .slice(0,10);

  index=0;
  score=0;
  correct=0;
  combo=0;
  bestCombo=0;

  loadQuestion();

}

function loadQuestion(){

  stopTimer();

  if(index>=round.length){

    finishGame();

    return;

  }

  let q=round[index];

  let order=q.a
    .map((a,i)=>({a,i}))
    .sort(()=>Math.random()-.5);

  app(`

  <div class="card">

    <div class="topbar">

      <div class="stat">
      👤 ${player||"لاعب"}
      </div>

      <div class="stat">
      ⭐ ${score}
      </div>

      <div class="stat">
      ❓ ${index+1}/10
      </div>

    </div>

    <div class="progress">
      <div style="width:${index*10}%"></div>
    </div>

    <div
    class="timer"
    id="timer">
    15
    </div>

    <div class="question">
      ${q.q}
    </div>

    <div id="answers">

      ${order.map(o=>`

        <button
        class="option"
        onclick="answerQuestion(${o.i})">

        ${o.a}

        </button>

      `).join("")}

    </div>

    <div id="feedback"></div>

  </div>

  `);

  speakTurkish(q.t);

  startTimer();

}

function answerQuestion(choice){

  if(!round[index])return;

  stopTimer();

  let q=round[index];

  let buttons=document.querySelectorAll(".option");

  buttons.forEach(
    b=>b.disabled=true
  );

  if(choice===q.c){

    correct++;

    combo++;

    bestCombo=Math.max(
      bestCombo,
      combo
    );

    let pts=

      (difficulty==="easy"
        ?100
        :difficulty==="medium"
          ?200
          :300)

      +

      (combo-1)*25;

    score+=pts;

    feedback(
      `✅ صحيح! +${pts} نقطة 🎉`,
      "success"
    );

    speakTurkish(
      "Harika! Doğru cevap!"
    );

  }else{

    combo=0;

    feedback(
      "❌ إجابة غير صحيحة",
      "notice"
    );

    speakTurkish(
      "Maalesef, yanlış cevap."
    );

  }

  setTimeout(()=>{

    index++;

    loadQuestion();

  },900);

}

function feedback(t,c){

  document.getElementById(
    "feedback"
  ).innerHTML=

  `<div class="feedback ${c}">
    ${t}
  </div>`;

}

function startTimer(){

  timeLeft=15;

  timer=setInterval(()=>{

    timeLeft--;

    let el=
      document.getElementById("timer");

    if(el)
      el.textContent=timeLeft;

    if(timeLeft<=0)
      timeoutQuestion();

  },1000);

}

function stopTimer(){

  if(timer){

    clearInterval(timer);

    timer=null;

  }

}

function timeoutQuestion(){

  stopTimer();

  document
    .querySelectorAll(".option")
    .forEach(b=>b.disabled=true);

  feedback(
    "⏰ انتهى الوقت!",
    "notice"
  );

  speakTurkish(
    "Süre doldu!"
  );

  setTimeout(()=>{

    index++;

    loadQuestion();

  },900);

}

function finishGame(){

  stopTimer();

  let rate=
    Math.round(
      correct/10*100
    );

  let old=
    stats[player] ||
    {
      games:0,
      score:0,
      best:0,
      correct:0
    };

  old.games++;

  old.score=
    Math.max(
      old.score,
      score
    );

  old.best=
    Math.max(
      old.best,
      bestCombo
    );

  old.correct+=correct;

  stats[player]=old;

  save();

  app(`

  <div class="card result">

    <h2>🏆 انتهت اللعبة!</h2>

    <p style="font-size:25px">
      👤 ${player}
    </p>

    <h1>
      ⭐ ${score}
    </h1>

    <p>
      ✅ الإجابات الصحيحة:
      ${correct}/10
    </p>

    <p>
      🔥 أفضل سلسلة:
      ${bestCombo}
    </p>

    <p>
      📈 نسبة النجاح:
      ${rate}%
    </p>

    <button
    class="primary"
    onclick="replayGame()">

      🔁 إعادة اللعب

    </button>

    <button
    class="secondary"
    style="margin-top:10px"
    onclick="home()">

      🏠 الرئيسية

    </button>

  </div>

  `);

  speakTurkish(
    rate>=70
    ? "Tebrikler! Çok güzel oynadın!"
    : "Bir dahaki sefere daha iyi olacak!"
  );

}

function replayGame(){

  startGame(
    category||"all"
  );

}

function leaderboard(){

  let rows=
    Object.entries(stats)
    .sort(
      (a,b)=>
      b[1].score-a[1].score
    );

  app(`

  <div class="card">

    <h2>🏆 لوحة الأبطال</h2>

    ${
      rows.length

      ?

      rows.map(
        (r,i)=>
        `<div class="leaderboard-row">
          #${i+1}
          👤 ${r[0]}
          —
          ⭐ ${r[1].score}
        </div>`
      ).join("")

      :

      "<p>لا توجد نتائج بعد.</p>"
    }

    <button
    class="secondary"
    onclick="home()">

      ⬅️ الرئيسية

    </button>

  </div>

  `);

}

function achievements(){

  let total=
    Object.values(stats)
    .reduce(
      (s,x)=>s+x.games,
      0
    );

  let best=
    Math.max(
      0,
      ...Object.values(stats)
      .map(x=>x.best||0)
    );

  app(`

  <div class="card">

    <h2>⭐ إنجازاتي</h2>

    <div class="achievement">

      🎮 عدد الألعاب:
      <b>${total}</b>

    </div>

    <div class="achievement">

      🔥 أفضل سلسلة:
      <b>${best}</b>

    </div>

    <div class="achievement">

      🏆 العب واجمع نقاط أكثر!

    </div>

    <button
    class="secondary"
    onclick="home()">

      ⬅️ الرئيسية

    </button>

  </div>

  `);

}

function settingsPage(){

  app(`

  <div class="card">

    <h2>⚙️ الإعدادات</h2>

    <div class="settings-row">

      <span>
        🔊 الصوت التركي
      </span>

      <button
      id="soundToggle"
      class="toggle ${settings.sound?"on":""}"
      onclick="toggleSound()">
      </button>

    </div>

    <div
    id="voiceStatus"
    class="feedback notice"
    style="margin-top:12px">

      جاري فحص الصوت التركي...

    </div>

    <button
    class="secondary"
    style="margin-top:10px"
    onclick="testTurkishVoice()">

      🔊 اختبار الصوت التركي

    </button>

    <p class="small"
    style="margin-top:14px">

      ملاحظة: يجب أن يكون صوت تركي
      متاحاً في جهازك.
      لن يتم تحويل النص العربي
      إلى صوت عربي.

    </p>

    <button
    class="secondary"
    style="margin-top:10px"
    onclick="home()">

      ⬅️ الرئيسية

    </button>

  </div>

  `);

  setTimeout(
    checkTurkishVoice,
    100
  );

}

function toggleSound(){

  settings.sound=
    !settings.sound;

  save();

  settingsPage();

}

function findTurkishVoice(){

  const voices=
    speechSynthesis.getVoices();

  return

    voices.find(
      v=>/^tr[-_]?tr$/i.test(v.lang)
    )

    ||

    voices.find(
      v=>/^tr[-_]/i.test(v.lang)
    )

    ||

    voices.find(
      v=>/turkish|türkçe|turk/i
      .test(v.name+" "+v.lang)
    )

    ||

    null;

}

function checkTurkishVoice(){

  const el=
    document.getElementById(
      "voiceStatus"
    );

  if(!el)return;

  const v=
    findTurkishVoice();

  el.className=
    "feedback "+
    (v?"success":"notice");

  el.textContent=

    v

    ?

    `🇹🇷 الصوت التركي جاهز: ${v.name}`

    :

    "⚠️ لم يتم العثور على صوت تركي في الآيفون. نزّل صوت Türkçe من إعدادات الجهاز.";

}

function speakTurkish(text){

  if(
    !settings.sound ||
    !("speechSynthesis" in window)
  )
    return;

  const voice=
    findTurkishVoice();

  if(!voice){

    checkTurkishVoice();

    return;

  }

  speechSynthesis.cancel();

  const u=
    new SpeechSynthesisUtterance(
      text
    );

  u.voice=voice;

  u.lang=
    voice.lang ||
    "tr-TR";

  u.rate=.88;

  u.pitch=1.02;

  speechSynthesis.speak(u);

}

function testTurkishVoice(){

  const v=
    findTurkishVoice();

  if(!v){

    checkTurkishVoice();

    return;

  }

  settings.sound=true;

  save();

  speakTurkish(
    "Merhaba! Bu Türkçe ses testidir. Hazır mısın?"
  );

}

if(
  "speechSynthesis" in window
){

  speechSynthesis.onvoiceschanged=
    ()=>{
      checkTurkishVoice();
    };

  setTimeout(
    checkTurkishVoice,
    500
  );

  setTimeout(
    checkTurkishVoice,
    1500
  );

}

home();

</script>

</body>
</html>
