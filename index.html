<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Tamim Quiz</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,"Noto Sans Arabic",sans-serif;
  background:
    radial-gradient(circle at top,#243b66 0,#111827 45%,#070b13 100%);
  color:white;
}

button{
  font-family:inherit;
}

.app{
  width:100%;
  max-width:650px;
  margin:auto;
  min-height:100vh;
  padding:18px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.logo{
  font-size:24px;
  font-weight:900;
}

.logo span{
  color:#fbbf24;
}

.icon-btn{
  border:0;
  background:#ffffff15;
  color:white;
  width:45px;
  height:45px;
  border-radius:15px;
  font-size:20px;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.card{
  background:#ffffff10;
  border:1px solid #ffffff15;
  border-radius:25px;
  padding:20px;
  margin-bottom:15px;
  backdrop-filter:blur(15px);
  box-shadow:0 15px 40px #0005;
}

.hero{
  text-align:center;
  padding:28px 18px;
}

.hero-image{
  width:150px;
  height:150px;
  margin:auto;
  display:block;
  border-radius:35px;
  box-shadow:0 15px 35px #0006;
}

h1{
  font-size:34px;
  margin:15px 0 8px;
}

h2{
  margin-top:5px;
}

.muted{
  color:#cbd5e1;
}

.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.menu button,
.big-btn{
  border:0;
  border-radius:20px;
  padding:18px 12px;
  color:white;
  background:#ffffff12;
  border:1px solid #ffffff18;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

.menu button:active,
.big-btn:active,
.answer:active{
  transform:scale(.97);
}

.primary{
  background:linear-gradient(135deg,#f59e0b,#ef4444)!important;
}

.green{
  background:linear-gradient(135deg,#10b981,#059669)!important;
}

.blue{
  background:linear-gradient(135deg,#3b82f6,#6366f1)!important;
}

.purple{
  background:linear-gradient(135deg,#8b5cf6,#ec4899)!important;
}

.back{
  border:0;
  background:transparent;
  color:#cbd5e1;
  font-size:16px;
  margin-bottom:12px;
  cursor:pointer;
}

.options{
  display:grid;
  gap:10px;
  margin-top:18px;
}

.option{
  border:2px solid #ffffff18;
  background:#ffffff0c;
  color:white;
  padding:16px;
  border-radius:17px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  text-align:right;
}

.option.correct{
  background:#059669!important;
  border-color:#34d399;
}

.option.wrong{
  background:#dc2626!important;
  border-color:#f87171;
}

.option.disabled{
  pointer-events:none;
}

.question-image{
  width:100%;
  height:190px;
  object-fit:cover;
  border-radius:20px;
  margin:10px 0 18px;
  background:#111827;
}

.top-info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.badge{
  background:#ffffff14;
  padding:9px 13px;
  border-radius:13px;
  font-weight:bold;
}

.timer{
  color:#fbbf24;
  font-size:20px;
  font-weight:900;
}

.progress{
  height:8px;
  background:#ffffff15;
  border-radius:20px;
  overflow:hidden;
  margin:12px 0 18px;
}

.progress-bar{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#f59e0b,#ef4444);
  transition:.3s;
}

.feedback{
  min-height:30px;
  text-align:center;
  font-size:19px;
  font-weight:bold;
  margin-top:14px;
}

.score-big{
  font-size:55px;
  font-weight:900;
  color:#fbbf24;
  text-align:center;
}

.center{
  text-align:center;
}

.player-grid,
.level-grid,
.category-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.select-card{
  border:0;
  color:white;
  background:#ffffff10;
  border:1px solid #ffffff18;
  padding:18px 10px;
  border-radius:20px;
  font-weight:bold;
  font-size:16px;
}

.select-card.selected{
  outline:3px solid #fbbf24;
}

.stat-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat{
  background:#ffffff0c;
  padding:18px;
  border-radius:18px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:27px;
  color:#fbbf24;
}

.leader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px;
  background:#ffffff0b;
  border-radius:16px;
  margin:8px 0;
}

.toggle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 0;
  border-bottom:1px solid #ffffff12;
}

.switch{
  width:55px;
  height:30px;
  border-radius:30px;
  background:#475569;
  padding:3px;
}

.switch i{
  display:block;
  width:24px;
  height:24px;
  background:white;
  border-radius:50%;
  transition:.2s;
}

.switch.on{
  background:#10b981;
}

.switch.on i{
  transform:translateX(-25px);
}

.achievement{
  display:flex;
  gap:12px;
  align-items:center;
  padding:14px;
  border-radius:18px;
  background:#ffffff0b;
  margin:8px 0;
}

.achievement.locked{
  opacity:.4;
}

.achievement-icon{
  font-size:30px;
}

.footer{
  text-align:center;
  color:#94a3b8;
  font-size:12px;
  padding:25px 0;
}

@media(max-width:420px){
  h1{font-size:29px}
  .menu button{padding:15px 8px;font-size:14px}
  .question-image{height:160px}
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="logo">🚀 Tamim<span>Quiz</span></div>
  <button class="icon-btn" onclick="showScreen('settings')">⚙️</button>
</header>

<!-- الرئيسية -->
<section id="home" class="screen active">

  <div class="card hero">

    <svg class="hero-image" viewBox="0 0 300 300">
      <defs>
        <linearGradient id="g" x1="0" x2="1">
          <stop offset="0" stop-color="#f59e0b"/>
          <stop offset="1" stop-color="#ef4444"/>
        </linearGradient>
      </defs>

      <rect width="300" height="300" rx="65" fill="#111827"/>
      <circle cx="150" cy="145" r="85" fill="url(#g)"/>
      <text x="150" y="160"
            text-anchor="middle"
            font-size="70"
            font-weight="bold"
            fill="white">TQ</text>
    </svg>

    <h1>Tamim Quiz</h1>
    <p class="muted">تعلّم، العب، واربح! 🎯</p>

    <button class="big-btn primary" style="width:100%;margin-top:15px"
            onclick="startGame()">
      🚀 ابدأ اللعب
    </button>

  </div>

  <div class="menu">
    <button onclick="showScreen('players')">👨‍👩‍👧‍👦 اللاعبين</button>
    <button onclick="showScreen('difficulty')">🧠 الصعوبة</button>
    <button onclick="showScreen('categories')">📚 الفئات</button>
    <button onclick="showScreen('leaderboard')">🏆 الأبطال</button>
    <button onclick="showScreen('achievements')">⭐ إنجازاتي</button>
    <button onclick="showScreen('settings')">⚙️ الإعدادات</button>
  </div>

  <div class="footer">صُنع بحب ❤️</div>
</section>

<!-- اللاعبين -->
<section id="players" class="screen">
  <button class="back" onclick="showScreen('home')">← الرئيسية</button>

  <div class="card">
    <h2>👨‍👩‍👧‍👦 اختر اللاعب</h2>

    <div class="player-grid">

      <button class="select-card" onclick="selectPlayer('سيدرا',this)">
        👧<br>سيدرا
      </button>

      <button class="select-card" onclick="selectPlayer('تميم',this)">
        👦<br>تميم
      </button>

      <button class="select-card" onclick="selectPlayer('شيراز',this)">
        👧<br>شيراز
      </button>

      <button class="select-card" onclick="selectPlayer('تيم',this)">
        👦<br>تيم
      </button>

    </div>

    <button class="big-btn blue"
            style="width:100%;margin-top:15px"
            onclick="addPlayer()">
      ➕ لاعب جديد
    </button>

  </div>
</section>

<!-- الصعوبة -->
<section id="difficulty" class="screen">
  <button class="back" onclick="showScreen('home')">← الرئيسية</button>

  <div class="card">
    <h2>🧠 اختر الصعوبة</h2>

    <div class="level-grid">

      <button class="select-card" onclick="selectDifficulty('easy',this)">
        🟢<br>سهل<br><small>100 نقطة</small>
      </button>

      <button class="select-card" onclick="selectDifficulty('medium',this)">
        🟡<br>متوسط<br><small>200 نقطة</small>
      </button>

      <button class="select-card" onclick="selectDifficulty('hard',this)">
        🔴<br>صعب<br><small>300 نقطة</small>
      </button>

      <button class="select-card" onclick="selectDifficulty('random',this)">
        🎲<br>عشوائي
      </button>

    </div>
  </div>
</section>

<!-- الفئات -->
<section id="categories" class="screen">
  <button class="back" onclick="showScreen('home')">← الرئيسية</button>

  <div class="card">
    <h2>📚 اختر الفئة</h2>

    <div class="category-grid">

      <button class="select-card" onclick="selectCategory('general',this)">
        🌍<br>معلومات عامة
      </button>

      <button class="select-card" onclick="selectCategory('animals',this)">
        🐾<br>حيوانات
      </button>

      <button class="select-card" onclick="selectCategory('space',this)">
        🚀<br>الفضاء
      </button>

      <button class="select-card" onclick="selectCategory('science',this)">
        🔬<br>العلوم
      </button>

      <button class="select-card" onclick="selectCategory('puzzles',this)">
        🧩<br>ألغاز
      </button>

      <button class="select-card" onclick="selectCategory('islam',this)">
        🕌<br>إسلاميات
      </button>

      <button class="select-card" onclick="selectCategory('sports',this)">
        ⚽<br>رياضة
      </button>

      <button class="select-card" onclick="selectCategory('fun',this)">
        😂<br>ممتعة
      </button>

      <button class="select-card" onclick="selectCategory('all',this)">
        🎲<br>كل الفئات
      </button>

    </div>
  </div>
</section>

<!-- اللعبة -->
<section id="game" class="screen">

  <div class="top-info">
    <div class="badge" id="playerLabel">👤 تميم</div>
    <div class="timer">⏱️ <span id="timer">15</span></div>
    <div class="badge">⭐ <span id="score">0</span></div>
  </div>

  <div class="progress">
    <div class="progress-bar" id="progress"></div>
  </div>

  <div class="card">

    <div class="muted" id="questionNumber">السؤال 1 من 10</div>

    <div id="questionVisual"></div>

    <h2 id="questionText"></h2>

    <div class="options" id="options"></div>

    <div class="feedback" id="feedback"></div>

  </div>

</section>

<!-- النتيجة -->
<section id="result" class="screen">

  <div class="card center">

    <h1>🎉 أحسنت!</h1>

    <p id="resultMessage"></p>

    <div class="score-big" id="finalScore">0</div>

    <p>نقطة ⭐</p>

    <div class="stat-grid">

      <div class="stat">
        <strong id="correctCount">0</strong>
        صحيحة
      </div>

      <div class="stat">
        <strong id="bestCombo">0</strong>
        أفضل سلسلة 🔥
      </div>

      <div class="stat">
        <strong id="successRate">0%</strong>
        نسبة النجاح
      </div>

      <div class="stat">
        <strong id="totalQuestions">10</strong>
        الأسئلة
      </div>

    </div>

    <button class="big-btn primary"
            style="width:100%;margin-top:18px"
            onclick="startGame()">
      🔄 العب مرة ثانية
    </button>

    <button class="big-btn"
            style="width:100%;margin-top:10px"
            onclick="showScreen('home')">
      🏠 الرئيسية
    </button>

  </div>

</section>

<!-- لوحة الأبطال -->
<section id="leaderboard" class="screen">
  <button class="back" onclick="showScreen('home')">← الرئيسية</button>

  <div class="card">

    <h2>🏆 لوحة الأبطال</h2>

    <div id="leaderboardList"></div>

  </div>
</section>

<!-- الإنجازات -->
<section id="achievements" class="screen">
  <button class="back" onclick="showScreen('home')">← الرئيسية</button>

  <div class="card">

    <h2>⭐ إنجازاتي</h2>

    <div id="achievementList"></div>

  </div>
</section>

<!-- الإعدادات -->
<section id="settings" class="screen">
  <button class="back" onclick="showScreen('home')">← الرئيسية</button>

  <div class="card">

    <h2>⚙️ الإعدادات</h2>

    <div class="toggle">
      <span>🔊 الصوت</span>
      <div id="soundSwitch"
           class="switch on"
           onclick="toggleSetting('sound')">
        <i></i>
      </div>
    </div>

    <div class="toggle">
      <span>📳 الاهتزاز</span>
      <div id="vibrationSwitch"
           class="switch on"
           onclick="toggleSetting('vibration')">
        <i></i>
      </div>
    </div>

    <button class="big-btn"
            style="width:100%;margin-top:20px"
            onclick="resetData()">
      🗑️ مسح النتائج
    </button>

  </div>
</section>

</div>

/* =========================
   الحالة
========================= */

let state = {
  player:"تميم",
  difficulty:"random",
  category:"all",
  sound:true,
  vibration:true
};

let game = {
  list:[],
  index:0,
  score:0,
  correct:0,
  combo:0,
  bestCombo:0,
  time:15,
  timer:null,
  answered:false
};

let stats =
JSON.parse(localStorage.getItem("tamimQuizStats") || "{}");

if(!stats.players) stats.players={};

let settings =
JSON.parse(localStorage.getItem("tamimQuizSettings") || "{}");

if(settings.sound !== undefined) state.sound=settings.sound;
if(settings.vibration !== undefined) state.vibration=settings.vibration;

/* =========================
   التنقل
========================= */

function showScreen(id){

  document.querySelectorAll(".screen")
    .forEach(s=>s.classList.remove("active"));

  document.getElementById(id)
    .classList.add("active");

  if(id==="leaderboard") renderLeaderboard();
  if(id==="achievements") renderAchievements();

  window.scrollTo(0,0);
}

/* =========================
   الاختيارات
========================= */

function selectPlayer(name,btn){

  state.player=name;

  document.querySelectorAll("#players .select-card")
    .forEach(x=>x.classList.remove("selected"));

  btn.classList.add("selected");

  speak("تم اختيار " + name);
}

function selectDifficulty(level,btn){

  state.difficulty=level;

  document.querySelectorAll("#difficulty .select-card")
    .forEach(x=>x.classList.remove("selected"));

  btn.classList.add("selected");
}

function selectCategory(cat,btn){

  state.category=cat;

  document.querySelectorAll("#categories .select-card")
    .forEach(x=>x.classList.remove("selected"));

  btn.classList.add("selected");
}

/* =========================
   إضافة لاعب
========================= */

function addPlayer(){

  const name=prompt("اكتب اسم اللاعب:");

  if(!name || !name.trim()) return;

  state.player=name.trim();

  speak("أهلًا " + state.player);

  alert("تم اختيار " + state.player);
}

/* =========================
   بدء اللعبة
========================= */

function startGame(){

  let list=[...questions];

  if(state.category!=="all"){
    list=list.filter(q=>q.category===state.category);
  }

  if(state.difficulty!=="random"){
    list=list.filter(q=>q.level===state.difficulty);
  }

  if(list.length<10){

    let extra=[...questions]
      .filter(q=>state.category==="all" || q.category===state.category);

    list=[...new Set([...list,...extra])];
  }

  list=shuffle(list).slice(0,10);

  game={
    list,
    index:0,
    score:0,
    correct:0,
    combo:0,
    bestCombo:0,
    time:15,
    timer:null,
    answered:false
  };

  document.getElementById("playerLabel")
    .textContent="👤 " + state.player;

  showScreen("game");

  speak("جاهز يا " + state.player);

  loadQuestion();
}

/* =========================
   السؤال
========================= */

function loadQuestion(){

  clearInterval(game.timer);

  game.answered=false;

  const q=game.list[game.index];

  document.getElementById("questionNumber")
    .textContent=`السؤال ${game.index+1} من ${game.list.length}`;

  document.getElementById("score")
    .textContent=game.score;

  document.getElementById("progress")
    .style.width=((game.index/game.list.length)*100)+"%";

  document.getElementById("questionText")
    .textContent=q.q;

  document.getElementById("questionVisual")
    .innerHTML=`
      <div class="question-image"
           style="display:flex;align-items:center;justify-content:center;font-size:90px">
        ${q.image}
      </div>
    `;

  const options=document.getElementById("options");
  options.innerHTML="";

  const answers=q.answers.map((text,i)=>({
    text,
    correct:i===q.correct
  }));

  shuffle(answers).forEach(answer=>{

    const btn=document.createElement("button");

    btn.className="option";
    btn.textContent=answer.text;

    btn.onclick=()=>answerQuestion(btn,answer.correct);

    options.appendChild(btn);
  });

  document.getElementById("feedback").textContent="";

  startTimer();
}

/* =========================
   المؤقت
========================= */

function startTimer(){

  game.time=15;

  document.getElementById("timer")
    .textContent=game.time;

  game.timer=setInterval(()=>{

    game.time--;

    document.getElementById("timer")
      .textContent=game.time;

    if(game.time<=0){

      clearInterval(game.timer);

      if(!game.answered){
        answerQuestion(null,false,true);
      }

    }

  },1000);
}

/* =========================
   الإجابة
========================= */

function answerQuestion(button,isCorrect,timeOut=false){

  if(game.answered) return;

  game.answered=true;

  clearInterval(game.timer);

  document.querySelectorAll(".option")
    .forEach(x=>x.classList.add("disabled"));

  const q=game.list[game.index];

  if(isCorrect){

    if(button) button.classList.add("correct");

    game.correct++;
    game.combo++;

    if(game.combo>game.bestCombo)
      game.bestCombo=game.combo;

    let points=100;

    if(q.level==="medium") points=200;
    if(q.level==="hard") points=300;

    const bonus=game.combo>=3 ? 50 : 0;

    game.score += points + bonus;

    let msg="أحسنت يا "+state.player+"! 🎉";

    if(game.combo>=3)
      msg+=" 🔥 سلسلة رائعة!";

    document.getElementById("feedback")
      .textContent=msg;

    speak(msg);

  }else{

    if(button) button.classList.add("wrong");

    game.combo=0;

    document.getElementById("feedback")
      .textContent=timeOut
      ?"⏰ انتهى الوقت!"
      :"❌ مو مشكلة، حاول مرة ثانية!";

    speak(timeOut
      ?"انتهى الوقت"
      :"حاول مرة ثانية"
    );

    if(button){

      [...document.querySelectorAll(".option")]
        .forEach(btn=>{
          if(btn.textContent===q.answers[q.correct]){
            btn.classList.add("correct");
          }
        });

    }
  }

  vibrate();

  setTimeout(()=>{

    game.index++;

    if(game.index>=game.list.length){
      finishGame();
    }else{
      loadQuestion();
    }

  },1100);
}

/* =========================
   النهاية
========================= */

function finishGame(){

  clearInterval(game.timer);

  const total=game.list.length;

  const rate=Math.round((game.correct/total)*100);

  document.getElementById("finalScore")
    .textContent=game.score;

  document.getElementById("correctCount")
    .textContent=game.correct;

  document.getElementById("bestCombo")
    .textContent=game.bestCombo;

  document.getElementById("successRate")
    .textContent=rate+"%";

  document.getElementById("totalQuestions")
    .textContent=total;

  let msg;

  if(rate===100){
    msg="🔥 مذهل! إجابات كاملة!";
  }else if(rate>=70){
    msg="🌟 ممتاز! استمر يا بطل!";
  }else if(rate>=50){
    msg="👏 جيد جدًا! تستطيع أن تصبح أفضل!";
  }else{
    msg="💪 لا تستسلم! جرب مرة أخرى!";
  }

  document.getElementById("resultMessage")
    .textContent=msg;

  saveResult(rate);

  showScreen("result");

  speak(msg);
}

/* =========================
   حفظ النتائج
========================= */

function saveResult(rate){

  if(!stats.players[state.player]){
    stats.players[state.player]={
      games:0,
      score:0,
      correct:0,
      best:0
    };
  }

  const p=stats.players[state.player];

  p.games++;
  p.score+=game.score;
  p.correct+=game.correct;
  p.best=Math.max(p.best,game.score);

  localStorage.setItem(
    "tamimQuizStats",
    JSON.stringify(stats)
  );
}

/* =========================
   لوحة الأبطال
========================= */

function renderLeaderboard(){

  const box=document.getElementById("leaderboardList");

  const players=Object.entries(stats.players)
    .sort((a,b)=>b[1].best-a[1].best);

  if(!players.length){

    box.innerHTML=
      `<p class="muted center">لسه ما في نتائج. العب أول جولة! 🎮</p>`;

    return;
  }

  box.innerHTML="";

  players.forEach((item,i)=>{

    const name=item[0];
    const p=item[1];

    const div=document.createElement("div");

    div.className="leader";

    div.innerHTML=`
      <span>${i===0?"🥇":i===1?"🥈":i===2?"🥉":"🏅"} ${name}</span>
      <strong>${p.best} نقطة</strong>
    `;

    box.appendChild(div);
  });
}
