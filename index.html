<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">

  <title>TamimTrack</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <header class="header">
      <div>
        <h1>💰 TamimTrack</h1>
        <p>إدارة مصاريفك بسهولة</p>
      </div>
    </header>

    <section class="total-card">
      <span>إجمالي المصاريف</span>
      <strong id="total">€0.00</strong>
    </section>

    <section class="card">

      <h2>➕ إضافة مصروف</h2>

      <label for="expenseName">اسم المصروف</label>
      <input
        id="expenseName"
        type="text"
        placeholder="مثلاً: مشتريات"
      >

      <label for="expenseAmount">المبلغ</label>
      <input
        id="expenseAmount"
        type="number"
        placeholder="0.00"
        step="0.01"
        min="0"
      >

      <label for="expenseCategory">التصنيف</label>
      <select id="expenseCategory">
        <option value="🍔 طعام">🍔 طعام</option>
        <option value="🚗 مواصلات">🚗 مواصلات</option>
        <option value="🛒 تسوق">🛒 تسوق</option>
        <option value="🏠 فواتير">🏠 فواتير</option>
        <option value="💊 صحة">💊 صحة</option>
        <option value="📦 أخرى">📦 أخرى</option>
      </select>

      <label for="expenseDate">التاريخ</label>
      <input
        id="expenseDate"
        type="date"
      >

      <button onclick="addExpense()">
        ➕ إضافة المصروف
      </button>

    </section>

    <section class="card">

      <div class="section-title">
        <h2>📋 المصاريف</h2>
        <span id="expenseCount">0</span>
      </div>

      <div id="expenseList">
        <p class="empty">لا توجد مصاريف حتى الآن 📭</p>
      </div>

    </section>

  </main>

  <script src="app.js"></script>

</body>
</html>
