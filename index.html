/* =========================

let audioContext=null;
let musicTimer=null;

function getAudio(){
  if(!audioContext){
    audioContext=new(
      window.AudioContext ||
      window.webkitAudioContext
    )();
  }

  if(audioContext.state==="suspended"){
    audioContext.resume();
  }

  return audioContext;
}

function sound(freq,duration,type="sine",volume=.07){
  if(!settings.sound) return;

  const ctx=getAudio();

  const osc=ctx.createOscillator();
  const gain=ctx.createGain();

  osc.type=type;
  osc.frequency.value=freq;

  gain.gain.setValueAtTime(volume,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    .001,
    ctx.currentTime+duration
  );

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start();
  osc.stop(ctx.currentTime+duration);
}

    );

  },700);
}

function stopMusic(){
  if(musicTimer){
    clearInterval(musicTimer);
    musicTimer=null;
  }
}

/* =========================
   ENGLISH VOICE
========================= */

function speakEnglish(text){
  if(
    !settings.sound ||
    !("speechSynthesis" in window)
  )return;

  speechSynthesis.cancel();

  const u=new SpeechSynthesisUtterance(text);

  u.lang="en-US";
  u.rate=.85;
  u.pitch=1;

  const voices=speechSynthesis.getVoices();

  const voice=voices.find(v=>
    v.lang &&
    v.lang.toLowerCase().startsWith("en")
  );

  if(voice)u.voice=voice;

  speechSynthesis.speak(u);
}

function speakPlayerName(){
  if(
    !settings.sound ||
    !("speechSynthesis" in window) ||
    !player
  )return;

  let englishName=player;

  if(player==="سيدرا"){
    englishName="Sidra";
  }
  else if(player==="تميم"){
    englishName="Tamim";
  }
  else if(player==="شيراز"){
    englishName="Shiraz";
  }
  else if(player==="تيم"){
    englishName="Taim";
  }

  speakEnglish(englishName);
}

function addPlayer(){
  const n=prompt("اكتب اسم اللاعب:");

  if(!n)return;

  const name=n.trim();

  if(!name)return;

  if(players.includes(name)){
    alert("هذا الاسم موجود بالفعل");
    return;
  }

  players.push(name);
  save();

  player=name;

  buttonSound();
  speakPlayerName();

  setTimeout(()=>{
    openDifficulty();
  },500);
}

/* =========================
   START GAME
========================= */

function startGame(){

  let pool=questions.filter(q=>{

    const catOK=
      category==="all" ||
      q.cat===category;

    const diffOK=
      difficulty==="random" ||
      q.d===difficulty;

    return catOK && diffOK;
  });

  if(pool.length===0){
    pool=questions.filter(q=>
      category==="all" ||
      q.cat===category
    );
  }

  round=[...pool];

  round.sort(()=>Math.random()-.5);

  index=0;
  score=0;
  correct=0;
  combo=0;
  bestCombo=0;

  startMusic();

  loadQuestion();
}

      </div>

      <div class="stat">
        ❓ ${index+1}/${round.length}
      </div>

    </div>

    <div class="card">

      <div class="progress">
        <div style="width:${(index/round.length)*100}%"></div>
      </div>

      <div class="timer" id="timer">
        ⏱️ ${timeLeft}
      </div>

      <div class="question">
        ${q.q}
      </div>

      <div id="options">
        ${q.a.map((answer,i)=>`
          <button
            class="option"
            onclick="answerQuestion(${i})">
            ${answer}
          </button>
        `).join("")}
      </div>

      <div
        id="feedback"
        class="feedback">
      </div>

    </div>
  `);

  startTimer();
}

/* =========================
   ANSWER
========================= */

function answerQuestion(choice){

  stopTimer();

  const q=round[index];

  const buttons=document.querySelectorAll(".option");

  buttons.forEach(b=>{
    b.disabled=true;
  });

  if(choice===q.c){

    correct++;

    combo++;

    if(combo>bestCombo){
      bestCombo=combo;
    }

    let pts=10;

    if(difficulty==="medium"){
      pts=15;
    }

    if(difficulty==="hard"){
      pts=20;
    }

    if(combo>=3){
      pts+=5;
    }

    score+=pts;

    correctSound();

    document.getElementById("feedback").innerHTML=
      `👏 Bravo! <br><span class="small">+${pts} نقطة</span>`;

    buttons[choice].style.background="#16a34a";

  }else{

    combo=0;

    wrongSound();

    document.getElementById("feedback").innerHTML=
      `❌ Wrong!<br>
       <span class="small">
       الإجابة الصحيحة: ${q.a[q.c]}
       </span>`;

    buttons[choice].style.background="#dc2626";
    buttons[q.c].style.background="#16a34a";
  }

  setTimeout(()=>{
    index++;
    loadQuestion();
  },1200);
}

/* =========================
   TIMER
========================= */

function startTimer(){

  timeLeft=15;

  timer=setInterval(()=>{

    timeLeft--;

    const el=document.getElementById("timer");

    if(el){
      el.textContent=`⏱️ ${timeLeft}`;
    }

    if(timeLeft<=5 && el){
      el.style.color="#ef4444";
    }

    if(timeLeft<=0){
      timeoutQuestion();
    }

  },1000);
}

function stopTimer(){

  if(timer){
    clearInterval(timer);
    timer=null;
  }
}

function timeoutQuestion(){

  stopTimer();

  timeoutSound();

  const q=round[index];

  const buttons=document.querySelectorAll(".option");

  buttons.forEach(b=>{
    b.disabled=true;
  });

  if(buttons[q.c]){
    buttons[q.c].style.background="#16a34a";
  }

  combo=0;

  const feedback=document.getElementById("feedback");

  if(feedback){
    feedback.innerHTML=
      `⏰ انتهى الوقت!<br>
       <span class="small">
       الإجابة الصحيحة: ${q.a[q.c]}
       </span>`;
  }

  setTimeout(()=>{
    index++;
    loadQuestion();
  },1200);
}

/* =========================
   FINISH
========================= */

function finishGame(){

  stopTimer();
  stopMusic();

  victorySound();

  if(!stats[player]){
    stats[player]={
      games:0,
      wins:0,
      score:0,
      correct:0,
      bestCombo:0
    };
  }

  stats[player].games++;
  stats[player].score+=score;
  stats[player].correct+=correct;

  if(score>0){
    stats[player].wins++;
  }

  if(bestCombo>stats[player].bestCombo){
    stats[player].bestCombo=bestCombo;
  }

  save();

  const percentage=
    round.length?
    Math.round((correct/round.length)*100):
    0;

  let message="أحسنت! 🎉";

  if(percentage===100){
    message="🔥 مثالي! كل الإجابات صحيحة!";
  }
  else if(percentage>=80){
    message="🏆 أداء رائع!";
  }
  else if(percentage>=50){
    message="👏 جيد جداً!";
  }
  else{
    message="💪 حاول مرة أخرى!";
  }

  app(`
    <div class="card result">

      <div class="success">

        <h1>🏆</h1>

        <h2>${message}</h2>

        <h3>${player}</h3>

        <p>⭐ النقاط: <b>${score}</b></p>

        <p>✅ الإجابات الصحيحة:
          <b>${correct}/${round.length}</b>
        </p>

        <p>📊 النتيجة:
          <b>${percentage}%</b>
        </p>

        <p>🔥 أفضل كومبو:
          <b>${bestCombo}</b>
        </p>

      </div>

      <div class="menu">

        <button
          class="primary"
          onclick="replayGame()">
          🔄 العب مرة أخرى
        </button>

        <button
          class="secondary"
          onclick="openPlayers()">
          👤 تغيير اللاعب
        </button>

        <button
          class="secondary"
          onclick="leaderboard()">
          🏆 المتصدرون
        </button>

        <button
          class="secondary"
          onclick="home()">
          🏠 الرئيسية
        </button>

      </div>

    </div>
  `);
}

function replayGame(){
  buttonSound();
  startGame();
}

/* =========================
   LEADERBOARD
========================= */

function leaderboard(){

  const list=Object.keys(stats)
    .map(name=>({
      name,
      score:stats[name].score||0
    }))
    .sort((a,b)=>b.score-a.score);

  app(`
    <div class="card">

      <h2>🏆 المتصدرون</h2>

      ${
        list.length?
        list.map((x,i)=>`
          <div class="leaderboard-row">
            <span>
              ${i===0?"🥇":i===1?"🥈":i===2?"🥉":"🏅"}
              ${x.name}
            </span>

            <b>${x.score} ⭐</b>
          </div>
        `).join("")
        :
        `<div class="notice">
          لا توجد نتائج بعد.
        </div>`
      }

      <button
        class="secondary"
        style="margin-top:12px"
        onclick="home()">
        ⬅️ الرئيسية
      </button>

    </div>
  `);
}

/* =========================
   ACHIEVEMENTS
========================= */

function achievements(){

  const totalGames=Object.values(stats)
    .reduce((sum,x)=>sum+(x.games||0),0);

  const totalCorrect=Object.values(stats)
    .reduce((sum,x)=>sum+(x.correct||0),0);

  const best=Object.values(stats)
    .reduce((max,x)=>Math.max(max,x.bestCombo||0),0);

  app(`
    <div class="card">

      <h2>🥇 الإنجازات</h2>

      <div class="achievement">
        🎮 المباريات
        <b>${totalGames}</b>
      </div>

      <div class="achievement">
        ✅ إجابات صحيحة
        <b>${totalCorrect}</b>
      </div>

      <div class="achievement">
        🔥 أفضل كومبو
        <b>${best}</b>
      </div>

      ${
        best>=5?
        `<div class="achievement">
          🔥🔥 ملك الكومبو!
        </div>`:""
      }

      ${
        totalGames>=10?
        `<div class="achievement">
          🎮 لاعب محترف!
        </div>`:""
      }

      ${
        totalCorrect>=50?
        `<div class="achievement">
          🧠 موسوعة!
        </div>`:""
      }

      <button
        class="secondary"
        style="margin-top:12px"
        onclick="home()">
        ⬅️ الرئيسية
      </button>

    </div>
  `);
}

/* =========================
   SETTINGS
========================= */

function settingsPage(){

  app(`
    <div class="card">

      <h2>⚙️ الإعدادات</h2>

      <div class="settings-row">

        <span>
          🔊 الأصوات والموسيقى
        </span>

        <button
          id="soundToggle"
          class="toggle ${settings.sound?"on":""}"
          onclick="toggleSound()">
        </button>

      </div>

      <div class="notice small">
        صوت الأسماء والتفاعل والمؤثرات أثناء اللعب.
      </div>

      <button
        class="secondary"
        style="margin-top:10px"
        onclick="home()">
        ⬅️ الرئيسية
      </button>

    </div>
  `);
}

function toggleSound(){

  settings.sound=!settings.sound;

  if(!settings.sound){
    stopMusic();
    speechSynthesis.cancel();
  }

  save();

  settingsPage();
}

/* =========================
   AUDIO UNLOCK FOR iPHONE
========================= */

document.addEventListener("click",()=>{
  try{
    getAudio();
  }catch(e){}
},{once:true});

/* =========================
   START
========================= */

home();

</script>
